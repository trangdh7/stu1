name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish --configuration Release --output ./publish --no-build

      - name: Stop IIS Application Pool (via SSH)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT || 22 }}
          script: |
            # Stop IIS Application Pool
            Import-Module WebAdministration
            Stop-WebAppPool -Name "DefaultAppPool" -ErrorAction SilentlyContinue
            Stop-Website -Name "Default Web Site" -ErrorAction SilentlyContinue
            
            # Wait a bit for processes to release files
            Start-Sleep -Seconds 5
            
            # Kill any remaining processes using the files
            Get-Process | Where-Object {$_.Path -like "*C:/inetpub/wwwroot/Webkho20241021*"} | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2

      - name: Deploy to Windows Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT || 22 }}
          source: "publish/*"
          target: "C:/inetpub/wwwroot/Webkho20241021"
          rm: true
          overwrite: true
          strip_components: 1
          timeout: 300s

      - name: Start IIS Application Pool (via SSH)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT || 22 }}
          script: |
            # Start IIS Application Pool
            Import-Module WebAdministration
            Start-WebAppPool -Name "DefaultAppPool"
            Start-Website -Name "Default Web Site"
