name: Deploy khostu .NET 8 to IIS

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup .NET 8
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # 3. Restore
      - name: Restore
        run: dotnet restore

      # 4. Build
      - name: Build
        run: dotnet build --configuration Release --no-restore

      # 5. Publish
      - name: Publish
        run: dotnet publish ./Webkho20241021/Webkho20241021.csproj -c Release -o ./publish --no-build

      # 6. HARD STOP IIS (QUAN TRỌNG NHẤT)
      - name: Stop IIS completely
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            iisreset /stop

      # 7. CLEAN THƯ MỤC DEPLOY
      - name: Clean old files
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            powershell -Command "
              if (Test-Path 'C:\inetpub\wwwroot\Webkho20241021') {
                Remove-Item -Recurse -Force 'C:\inetpub\wwwroot\Webkho20241021'
              }
              New-Item -ItemType Directory -Force -Path 'C:\inetpub\wwwroot\Webkho20241021'
            "

      # 8. COPY FILE LÊN SERVER (KHÔNG rm)
      - name: Upload publish folder to IIS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "publish/*"
          target: "C:/inetpub/wwwroot/Webkho20241021"

      # 9. START IIS LẠI
      - name: Start IIS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            iisreset /start
